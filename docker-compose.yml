version: '3'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    volumes:
      - ./app/:/var/www/symfony
    ports:
      - 8001:80
    networks:
      - symfony
  php:
    build:
      context: .
      dockerfile: Dockerfile-php
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://proassist:secretPR0@db:5432/app?serverVersion=16&charset=utf8
      PHP_FPM_REQUEST_TERMINATE_TIMEOUT: 300
    volumes:
      - ./app/:/var/www/symfony/
    networks:
      - symfony
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    container_name: symfony_db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: proassist
      POSTGRES_PASSWORD: secretPR0
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - symfony

networks:
  symfony:

volumes:
  db_data: